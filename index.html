<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reverse Desmos — Coordinate Grid & Drawing</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <div class="brand">
        <h1>Reverse Desmos</h1>
        <span class="badge">Milestone 1</span>
      </div>
      <p class="instructions">
        Draw a function or curve on the grid using your mouse, stylus, or finger.
      </p>
    </header>

    <main class="canvas-wrapper">
      <div class="canvas-card">
        <canvas id="graph-canvas" aria-label="Interactive coordinate grid for drawing graphs"></canvas>
      </div>

      <div class="controls-bar">
        <div class="stats" id="stats-display">
          <span class="stat-item">Domain: <strong>[-10, 10]</strong></span>
          <span class="stat-divider">•</span>
          <span class="stat-item">Range: <strong>[-10, 10]</strong></span>
          <span class="stat-divider">•</span>
          <span class="stat-item">Strokes: <strong id="stroke-count">0</strong></span>
        </div>

        <div class="actions">
          <button id="clear-btn" type="button" class="btn btn-secondary" title="Clear all drawings (Preserves grid)">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 6h18"></path>
              <path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"></path>
              <path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"></path>
            </svg>
            Clear Drawing
          </button>
        </div>
      </div>
    </main>

    <footer class="app-footer">
      <p>Fixed coordinate space: <code>x ∈ [-10, 10]</code>, <code>y ∈ [-10, 10]</code>. Drawings persist across window resize.</p>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>

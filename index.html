<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Somsed - Reverse Desmos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css" />
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <div class="app-container">
    <header class="app-header">
      <div class="header-left">
        <div class="mode-toggle-group" role="radiogroup" aria-label="Tool mode">
          <button type="button" id="mode-draw-btn" class="mode-btn active"
            title="Draw Mode (Draw freehand or hold to snap)">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 19l7-7 3 3-7 7-3-3z"></path>
              <path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"></path>
              <path d="M2 2l7.586 7.586"></path>
              <circle cx="11" cy="11" r="2"></circle>
            </svg>
            <span>Draw</span>
          </button>
          <button type="button" id="mode-edit-btn" class="mode-btn" title="Edit Mode (Select and transform shapes)">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 3l7.07 16.97 2.51-7.39 7.39-2.51L3 3z"></path>
              <path d="M13 13l6 6"></path>
            </svg>
            <span>Edit</span>
          </button>
        </div>

        <div class="mobile-tab-group" role="tablist">
          <button id="mobile-tab-graph" type="button" class="mobile-tab-btn active" role="tab">Graph</button>
          <button id="mobile-tab-sidebar" type="button" class="mobile-tab-btn" role="tab">Expressions</button>
        </div>
      </div>

      <div class="brand-center">
        <h1 class="brand-title" aria-label="Somsed">
          <img src="somsed-logo.svg" alt="Somsed" class="somsed-wordmark-logo" />
        </h1>
        <span class="brand-subtitle">(reverse desmos)</span>
      </div>

      <div class="header-right">
        <div class="stats" id="stats-display">
          <span class="stat-item"><strong id="domain-display">[-10.0, 10.0]</strong></span>
          <span class="stat-divider">•</span>
          <span class="stat-item"><strong id="stroke-count">0</strong> items</span>
        </div>

        <div class="actions">
          <button id="debug-toggle-btn" type="button" class="btn btn-header debug-btn"
            title="Toggle Diagnostics Telemetry">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <rect width="8" height="14" x="8" y="6" rx="4"></rect>
              <path d="m19 7-3 2"></path>
              <path d="m5 7 3 2"></path>
              <path d="m19 19-3-2"></path>
              <path d="m5 19 3-2"></path>
              <path d="M20 13h-4"></path>
              <path d="M4 13h4"></path>
              <path d="m10 4 1 2"></path>
              <path d="m14 4-1 2"></path>
            </svg>
            <span>Debug</span>
          </button>

          <button id="clear-btn" type="button" class="btn btn-header btn-clear" title="Clear all shapes and drawings">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 6h18"></path>
              <path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"></path>
              <path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"></path>
            </svg>
            <span>Clear</span>
          </button>
        </div>
      </div>
    </header>

    <main class="workspace">
      <aside class="sidebar" id="sidebar" aria-label="Expressions and Properties Sidebar">
        <div class="sidebar-header">
          <div class="sidebar-title">
            <h2>Expressions</h2>
            <span id="equation-count-badge" class="equation-count-badge">0 items</span>
          </div>
          <button id="sidebar-collapse-btn" class="sidebar-icon-btn" title="Collapse sidebar" aria-label="Collapse sidebar">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <path d="m15 18-6-6 6-6"></path>
            </svg>
          </button>
        </div>

        <div class="sidebar-content">
          <section class="properties-card hidden" id="properties-card" aria-label="Shape Properties">
            <div class="properties-header">
              <div class="properties-title">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                  stroke-linecap="round" stroke-linejoin="round">
                  <path d="M12 20h9"></path>
                  <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path>
                </svg>
                <h3>Properties</h3>
              </div>
              <span id="properties-shape-badge" class="properties-shape-badge">Selected</span>
            </div>
            <div id="properties-body" class="properties-body">
            </div>
          </section>

          <section class="equations-card" id="equations-card" aria-label="Mathematical Equations">
            <div id="equations-list" class="equations-list">
              <div class="empty-state-simple">Draw on the graph to begin.</div>
            </div>
          </section>

          <div id="debug-panel" class="debug-panel hidden">
            <div class="debug-header">
              <div class="debug-title">
                <h4>Diagnostics</h4>
              </div>
              <span id="debug-winner-badge" class="debug-badge">No Attempts</span>
            </div>
            <div class="debug-actions">
              <button id="debug-copy-btn" type="button" class="btn btn-secondary btn-sm"
                title="Copy raw stroke points as JSON">
                Copy JSON
              </button>
              <button id="debug-replay-toggle-btn" type="button" class="btn btn-secondary btn-sm"
                title="Replay stroke from JSON">
                Replay Stroke
              </button>
            </div>
            <div id="debug-replay-box" class="debug-replay-box hidden">
              <textarea id="debug-replay-input" rows="3"
                placeholder='Paste stroke JSON array here, e.g. [{"x": -3, "y": 2}, ...]'></textarea>
              <button id="debug-run-replay-btn" type="button" class="btn btn-secondary btn-sm">Run Recognition</button>
            </div>
            <div class="debug-body" id="debug-content">
              <p class="debug-placeholder">Draw and hold a stroke to inspect candidate scores and telemetry.</p>
            </div>
          </div>
        </div>
      </aside>

      <div class="sidebar-resizer" id="sidebar-resizer" title="Drag to resize sidebar"></div>

      <button id="sidebar-expand-btn" class="sidebar-expand-btn hidden" title="Expand sidebar">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="m9 18 6-6-6-6"></path>
        </svg>
        <span>Expressions</span>
      </button>

      <section class="graph-area">
        <div class="canvas-container">
          <canvas id="graph-canvas"
            aria-label="Interactive coordinate grid for drawing and recognizing geometric graphs"></canvas>
        </div>

        <div class="graph-controls-overlay">
          <button id="zoom-in-btn" class="graph-ctrl-btn" title="Zoom In (+)" aria-label="Zoom In">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <line x1="12" y1="5" x2="12" y2="19"></line>
              <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
          </button>
          <button id="zoom-out-btn" class="graph-ctrl-btn" title="Zoom Out (-)" aria-label="Zoom Out">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
          </button>
          <button id="zoom-reset-btn" class="graph-ctrl-btn" title="Reset View (Default Zoom)" aria-label="Reset View">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
              <polyline points="9 22 9 12 15 12 15 22"></polyline>
            </svg>
          </button>
        </div>

        <div class="status-banner" id="status-banner" aria-live="polite">
          <span class="status-dot"></span>
          <span id="status-text">Draw a shape and hold to snap. Drag to adjust size and angle.</span>
        </div>
      </section>
    </main>
  </div>

  <script src="config.js"></script>
  <script src="analytics.js"></script>
  <script src="recognition.js"></script>
  <script src="equations.js"></script>
  <script src="script.js"></script>
</body>

</html>
